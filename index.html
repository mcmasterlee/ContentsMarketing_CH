 출발점부터 명확해서 페이지 전체가 같은 방향으로 읽힙니다."], ["세 가지 핵심 목표", "콘텐츠 기획·제작 자동화, 데이터 기반 성과 분석, 반복 업무 최소화라는 세 축이 발표의 중심입니다. 목표 정의가 간결해 전체 구조를 빠르게 이해할 수 있습니다."], ["레퍼런스 큐레이션", "피그마 버즈, 태블로, ChatGPT·Claude·Gemini, 나노바나나, Sora·Runway 등 다양한 레퍼런스가 이어집니다. 단순 나열이 아니라 어떤 업무를 바꿀지 맥락과 함께 제시됩니다."], ["웹앱 자체가 발표 방식", "문서가 아닌 싱글 페이지 웹앱을 통해 발표 내용을 전달합니다. 보는 방식과 전달 내용이 일치해 설득력이 높습니다."], ["활동 로드맵", "4월부터 11월까지의 일정이 단계별로 정리되어 프로젝트 로드맵처럼 읽힙니다. 탐색에서 적용까지의 흐름이 분명합니다."], ["AI와 사람의 협업 문화", "Special Thanks와 협업 레퍼런스를 통해 도구 사용을 넘어 새로운 협업 태도를 보여줍니다. AI를 동료처럼 다루는 감각이 인상적입니다."]], "highlights": ["아이디어 → 실행 → 효율 → 전략", "발표 자료가 곧 웹 경험이 되는 구조", "레퍼런스를 실행 언어로 번역한 팀 소개", "사람과 AI가 함께 만드는 협업 문화"], "points": ["팀 목표를 한눈에 읽히는 웹앱 구조로 정리", "실무형 AI 레퍼런스를 맥락 있게 큐레이션", "발표 방식 자체를 경험형 인터페이스로 설계", "이번 아카이브 상세 페이지의 기준 무드가 된 발표"], "questions": ["우리 팀은 AI를 통해 어떤 업무를 전략 업무로 바꾸고 싶은가?", "레퍼런스를 수집하는 단계에서 실행 단계로 넘어가기 위한 장치는 무엇인가?", "문서 대신 웹앱으로 발표할 때 전달 경험은 어떻게 달라지는가?"], "links": [["AIdea 웹앱 보기", "https://roraa21.github.io/AIdea/"]]}, {"id": "s4", "slug": "session-04-goods.html", "month": "05", "date": "2026.05.05", "time": "11:00", "type": "마케팅", "title": "굿즈 마케팅 가이드", "speaker": "비바샘마케팅 Cell · 조원진 CP", "summary": "굿즈를 브랜드 팬덤과 관계 형성의 도구로 정의하고, 타깃·아이템·제작·디자인 원칙을 체계화한 발표.", "overview": "굿즈를 예쁜 사은품이 아니라 브랜드 아이덴티티를 확장하는 매개체로 다룬 발표입니다. 타깃 세분화부터 제작사 체크리스트, 디자인 원칙까지 실무에 바로 적용할 수 있는 구조로 정리되어 있습니다.", "cover": "https://www.genspark.ai/api/files/s/DLvQC9Pe", "sheet": "https://www.genspark.ai/api/files/s/cSOfjOAx", "tags": ["굿즈", "타깃 세분화", "디자인 원칙", "체크리스트"], "sections": [["굿즈의 정의", "굿즈는 단순 증정품이 아니라 브랜드 정체성을 담는 파생 상품으로 제시됩니다. 사용성과 감정적 연결을 동시에 만드는 것이 핵심입니다."], ["5단계 프로세스", "타깃 세분화, 아이템 선정, 업체 서칭, 기획·디자인, 제작·발주라는 흐름으로 정리됩니다. 감이 아니라 프로세스로 접근하는 실무 감각이 돋보입니다."], ["타깃별 전략 차별화", "VIP, 관심 고객, 잠재 고객으로 구분해 예산과 아이템을 다르게 설계합니다. 누구에게 주는지에 따라 굿즈의 역할이 달라진다는 관점이 중요합니다."], ["아이템 라인업 설계", "프리미엄형, 실용형, 확산형으로 나뉜 아이템 구성이 제안됩니다. 굿즈를 단순히 예산으로만 고르지 않고 목적과 맥락으로 고릅니다."], ["업체 선정 체크리스트", "품질, 단가, 납기, 패키징, 샘플 확인 등 실행 단계에서 발생할 수 있는 리스크를 미리 점검합니다. 예쁜 시안보다 안정적인 실행이 더 중요하다는 메시 function cardTemplate(session){
  const resourceBtn = session.links && session.links.length
    ? `<a class="topic-btn secondary" href="${session.links[0][1]}" target="_blank" rel="noreferrer">${session.links[0][0].includes('웹앱') ? '웹앱 바로가기' : '원본 자료'}</a>`
    : '';
  const chatbotLink = session.links && session.links.length
    ? session.links.find(link => link[0].includes('챗봇'))
    : null;
  const chatbotBtn = chatbotLink
    ? `<a class="topic-btn secondary" href="${chatbotLink[1]}" target="_blank" rel="noreferrer">챗봇 바로가기</a>`
    : '';
  const points = session.points ? session.points.slice(0, 3).map(point => `<li>${point}</li>`).join('') : '';
  return `
    <article class="session-card reveal">
      <div class="session-shell">
        <aside class="session-aside">
          <span class="month-chip">${session.month}월</span>
          <p class="session-date">${session.date}</p>
          <p class="session-time">${session.time}</p>
          <span class="type-chip">${session.type}</span>
        </aside>
        <div class="session-main">
          <div class="session-header">
            <div>
              <h3 class="session-title">${session.title}</h3>
              <p class="session-speaker">${session.speaker}</p>
            </div>
            <button class="toggle-btn" type="button">자세히 보기</button>
          </div>
          <p class="session-summary">${session.summary}</p>
          <div class="tag-list">${session.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}</div>
          <div class="session-detail">
            <div class="detail-grid">
              <section class="detail-panel">
                <h4>발표 개요</h4>
                <p>${session.overview}</p>
              </section>
              <section class="detail-panel">
                <h4>핵심 포인트</h4>
                <ul class="bullet-list">${points}</ul>
              </section>
            </div>
          </div>
          <div class="session-actions">
            <a class="topic-btn secondary" href="./${session.slug}">발표 기록 자세히 보기</a>
            ${resourceBtn}
            ${chatbotBtn}
          </div>
        </div>
      </div>
    </article>`;
}

function render(filter='all'){
  const filtered = filter === 'all' ? sessions : sessions.filter(s => s.month === filter);
  grid.innerHTML = filtered.map(cardTemplate).join('');
  grid.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const card = btn.closest('.session-card');
      const opened = card.classList.toggle('is-open');
      btn.textContent = opened ? '접기' : '자세히 보기';
    });
  });
  observeReveals();
}

filters.forEach(btn => {
  btn.addEventListener('click', () => {
    filters.forEach(b => b.classList.remove('is-active'));
    btn.classList.add('is-active');
    render(btn.dataset.filter);
  });
});

function observeReveals(){
  const els = document.querySelectorAll('.reveal');
  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if(entry.isIntersecting) entry.target.classList.add('is-visible'); });
  }, {threshold:.12});
  els.forEach(el => io.observe(el));
}

render();
observeReveals();
</script>
</body>
</html>
